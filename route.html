<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Route</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --sky-top: #0a1628;
  --sky-bot: #1a3a6b;
  --glass: rgba(255,255,255,0.10);
  --glass-border: rgba(255,255,255,0.18);
  --blue: #3b82f6;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --radius: 16px;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(160deg, var(--sky-top) 0%, var(--sky-bot) 100%);
  min-height: 100vh;
  color: white;
  overflow-x: hidden;
}

.clouds-layer {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:0; overflow:hidden; opacity:0.45;
}
.clouds-layer::before {
  content:""; position:absolute; top:10%; left:-20%;
  width:320px; height:90px; background:rgba(255,255,255,0.25);
  border-radius:50%; filter:blur(24px);
  animation: drift 65s linear infinite;
}
.clouds-layer::after {
  content:""; position:absolute; bottom:22%; left:-300px;
  width:440px; height:110px; background:rgba(255,255,255,0.18);
  border-radius:50%; filter:blur(32px);
  animation: drift 85s linear infinite; animation-delay:-35s;
}
@keyframes drift { 0%{transform:translateX(0)} 100%{transform:translateX(120vw)} }

#page {
  position: relative; z-index: 1;
  padding: 60px 0 140px;
  max-width: 480px; margin: 0 auto;
}

/* ADDRESS BAR */
#address-bar {
  padding: 14px 16px 10px;
  display: flex; align-items: center; gap: 10px;
}
#address-input {
  flex: 1; padding: 12px 16px;
  background: rgba(255,255,255,0.10);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 14px; color: white;
  font-size: 15px; font-weight: 600;
  outline: none; font-family: inherit;
  transition: all 0.25s;
}
#address-input::placeholder { color: rgba(255,255,255,0.38); font-weight: 400; }
#address-input:focus { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.15); }
#address-input.locked {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.7);
  pointer-events: none;
}
#save-btn {
  padding: 12px 20px; border-radius: 14px; border: none;
  background: var(--blue); color: white;
  font-weight: 700; font-size: 14px; cursor: pointer;
  font-family: inherit; flex-shrink: 0;
  transition: transform 0.15s;
}
#save-btn:active { transform: scale(0.93); }
#save-btn.hidden { display: none; }
#change-btn {
  width: 42px; height: 42px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.2);
  color: white; font-size: 20px; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  flex-shrink: 0; transition: transform 0.35s ease;
}
#change-btn.visible { display: flex; }
#change-btn:active { transform: rotate(180deg); }

#status-line {
  text-align: center; font-size: 12px;
  color: rgba(255,255,255,0.45); letter-spacing: 0.5px;
  padding: 2px 16px 10px; min-height: 22px;
}

/* CLIENT LIST */
#client-list { padding: 0 12px; }

/* CLIENT ROW */
.client-row {
  display: flex; align-items: center; gap: 10px;
  padding: 15px 14px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  transition: opacity 0.3s, background 0.2s;
  position: relative;
  animation: rowIn 0.3s ease both;
}
@keyframes rowIn {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
.client-row.paused { opacity: 0.32; }
.client-row.highlighted {
  border-color: rgba(59,130,246,0.65);
  background: rgba(59,130,246,0.14);
}
.client-row.dragging { opacity: 0.25; }
.client-row.drag-over {
  border-color: rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.14);
}

/* collapse animation */
.client-row.collapsing {
  overflow: hidden;
  animation: collapseRow 0.38s ease forwards;
}
@keyframes collapseRow {
  0%   { opacity:1; max-height:70px; margin-bottom:8px; padding-top:15px; padding-bottom:15px; }
  100% { opacity:0; max-height:0;    margin-bottom:0;   padding-top:0;    padding-bottom:0; border-width:0; }
}

.drag-handle {
  color: rgba(255,255,255,0.28); font-size: 18px;
  cursor: grab; flex-shrink: 0;
  user-select: none; letter-spacing: -2px; line-height: 1;
}

.client-name {
  flex: 1; font-size: 1rem; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  letter-spacing: 0.2px;
  transition: opacity 0.15s;
}
.client-name:active { opacity: 0.55; }

.pause-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.45); font-size: 13px;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0;
  transition: all 0.2s;
}
.pause-btn.active {
  background: rgba(245,158,11,0.22);
  border-color: var(--amber); color: var(--amber);
}
.pause-btn:active { transform: scale(0.88); }

/* EOD DIVIDER */
.eod-divider {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 14px; margin: 2px 0 6px;
}
.eod-line { flex:1; height:1px; background:rgba(255,255,255,0.14); }
.eod-dot {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,0.07);
  border: 1.5px solid rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: all 0.2s;
}
.eod-dot-inner {
  width: 13px; height: 13px; border-radius: 50%;
  background: rgba(255,255,255,0.45);
  transition: all 0.25s;
}
.eod-dot:active .eod-dot-inner {
  background: var(--red);
  box-shadow: 0 0 12px rgba(239,68,68,0.9);
}
.eod-dot.fired .eod-dot-inner {
  background: var(--red);
  box-shadow: 0 0 14px rgba(239,68,68,0.85);
  animation: pulseRed 0.9s ease-in-out 3;
}
@keyframes pulseRed {
  0%,100% { box-shadow: 0 0 8px rgba(239,68,68,0.6); }
  50%      { box-shadow: 0 0 22px rgba(239,68,68,1); transform:scale(1.2); }
}

/* ADD NEXT BUTTON */
#add-next-btn {
  display: none; margin: 10px 12px 0;
  width: calc(100% - 24px); padding: 15px;
  background: rgba(34,197,94,0.12);
  border: 1.5px dashed rgba(34,197,94,0.4);
  border-radius: var(--radius);
  color: rgba(34,197,94,0.85);
  font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: all 0.2s;
}
#add-next-btn:active { background: rgba(34,197,94,0.22); }

/* SEARCH BAR */
#search-bar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 96px); max-width: 360px; z-index: 200;
  display: flex; align-items: center; gap: 0;
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.26);
  border-radius: 30px; padding: 8px 8px 8px 18px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
#search-input {
  flex:1; border:none; background:transparent;
  color:white; font-size:16px; font-weight:600;
  outline:none; font-family:inherit; caret-color:white;
}
#search-input::placeholder { color:rgba(255,255,255,0.35); font-weight:400; }
#search-clear {
  width:34px; height:34px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.13); color:white;
  font-size:15px; cursor:pointer;
  display:none; align-items:center; justify-content:center;
}
#search-clear.visible { display:flex; }

/* RADAR BUTTON */
#radar-btn {
  position: fixed; bottom: 20px; right: 16px;
  width: 52px; height: 52px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white; font-size: 22px; cursor: pointer; z-index: 200;
  box-shadow: 0 4px 18px rgba(37,99,235,0.55);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s;
}
#radar-btn:active { transform: scale(0.88); }
#radar-btn.spinning { animation: spin 0.9s ease-out; }
@keyframes spin { to { transform: rotate(360deg); } }

/* RADAR OVERLAY */
#radar-overlay {
  position:fixed; top:0; left:0; width:100vw; height:100vh;
  pointer-events:none; z-index:50; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.radar-ring {
  position:absolute; border:2px solid rgba(179,229,252,0.4);
  border-radius:50%; opacity:0;
  animation: ripple 2.8s ease-out infinite;
}
.radar-ring:nth-child(2){animation-delay:0.9s}
.radar-ring:nth-child(3){animation-delay:1.8s}
@keyframes ripple {
  0%  {width:0;height:0;opacity:0.8}
  60% {opacity:0.25}
  100%{width:200vmax;height:200vmax;opacity:0}
}

#empty-state {
  text-align:center; padding:60px 20px;
  color:rgba(255,255,255,0.32); font-size:14px;
  letter-spacing:0.5px; display:none; line-height:1.8;
}
#empty-state .icon { font-size:2.8rem; margin-bottom:10px; }
</style>
</head>
<body>

<div class="clouds-layer"></div>
<div id="radar-overlay">
  <div class="radar-ring"></div>
  <div class="radar-ring"></div>
  <div class="radar-ring"></div>
</div>

<div id="page">
  <div id="address-bar">
    <button onclick="window.location.href='index.html'" style="background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.20);border-radius:12px;color:white;font-size:18px;padding:10px 14px;cursor:pointer;flex-shrink:0;">←</button>
    <input id="address-input" type="text" placeholder="Starting address..." autocomplete="off" spellcheck="false">
    <button id="save-btn" onclick="saveAddress()">Save</button>
    <button id="change-btn" onclick="unlockAddress()">↺</button>
  </div>
  <div id="status-line"></div>
  <div id="client-list"></div>
  <div id="empty-state"><div class="icon">🌿</div>No clients found.<br>Open from the main app.</div>
  <button id="add-next-btn" onclick="addNextClient()">＋ Add Next Closest</button>
</div>

<div id="search-bar">
  <input id="search-input" type="text" placeholder="Search client..." autocomplete="off" spellcheck="false">
  <button id="search-clear" onclick="clearSearch()">✕</button>
</div>
<button id="radar-btn" onclick="refreshGPS()">📡</button>

<script>
// ═══════════════════════════
//  STATE
// ═══════════════════════════
let allClients   = [];
let routeList    = [];      // full ordered list of client objects
let eodIndex     = 0;       // dot sits after routeList[eodIndex] (0 = after first)
let completedIds = new Set();
let pausedIds    = new Set();
let weekDone     = false;
let homeAddress  = '';
let homeCoords   = null;
let geocodeCache = new Map();

// ═══════════════════════════
//  BOOT
// ═══════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  loadClients();
  loadState();
  setupSearch();
  stopRadar();

  if (homeAddress) {
    lockAddress(homeAddress);
    if (routeList.length > 0) {
      render();
      setStatus('');
    } else {
      buildRoute();
    }
  }
});

// ═══════════════════════════
//  DATA
// ═══════════════════════════
function loadClients() {
  try {
    const cc = JSON.parse(localStorage.getItem('currentClients') || '[]');
    const oc = JSON.parse(localStorage.getItem('oneTimeClients') || '[]');
    allClients = [...cc, ...oc];
    allClients.forEach(c => {
      if (c.gpsLat && c.gpsLon && c.address)
        geocodeCache.set(c.address, { lat: parseFloat(c.gpsLat), lon: parseFloat(c.gpsLon) });
    });
  } catch(e) { allClients = []; }
}

function loadState() {
  try {
    homeAddress = localStorage.getItem('rHomeAddress') || '';
    if (homeAddress) document.getElementById('address-input').value = homeAddress;
    const hc = localStorage.getItem('rHomeCoords');
    if (hc) homeCoords = JSON.parse(hc);
    const s = localStorage.getItem('rState');
    if (s) {
      const p = JSON.parse(s);
      routeList    = p.routeList    || [];
      eodIndex     = p.eodIndex     ?? 0;
      completedIds = new Set(p.completedIds || []);
      pausedIds    = new Set(p.pausedIds    || []);
      weekDone     = p.weekDone     || false;
    }
  } catch(e) {}
}

function saveState() {
  localStorage.setItem('rHomeAddress', homeAddress);
  if (homeCoords) localStorage.setItem('rHomeCoords', JSON.stringify(homeCoords));
  localStorage.setItem('rState', JSON.stringify({
    routeList, eodIndex,
    completedIds: [...completedIds],
    pausedIds:    [...pausedIds],
    weekDone
  }));
}

// ═══════════════════════════
//  ADDRESS
// ═══════════════════════════
function saveAddress() {
  const val = document.getElementById('address-input').value.trim();
  if (!val) { setStatus('Enter an address first'); return; }
  homeAddress = val;
  homeCoords  = null; // reset so it re-geocodes
  lockAddress(val);
  // Reset route
  routeList = []; completedIds = new Set(); pausedIds = new Set();
  eodIndex = 0; weekDone = false;
  buildRoute();
}

function lockAddress(val) {
  document.getElementById('address-input').value = val;
  document.getElementById('address-input').classList.add('locked');
  document.getElementById('save-btn').classList.add('hidden');
  document.getElementById('change-btn').classList.add('visible');
}

function unlockAddress() {
  document.getElementById('address-input').classList.remove('locked');
  document.getElementById('save-btn').classList.remove('hidden');
  document.getElementById('change-btn').classList.remove('visible');
  document.getElementById('address-input').focus();
}

// ═══════════════════════════
//  GEOCODING
// ═══════════════════════════
async function geocode(address) {
  if (!address) return null;
  if (geocodeCache.has(address)) return geocodeCache.get(address);
  try {
    const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(address)}&limit=1&lang=en`);
    if (r.ok) {
      const d = await r.json();
      if (d.features?.length) {
        const [lon, lat] = d.features[0].geometry.coordinates;
        const c = { lat: parseFloat(lat), lon: parseFloat(lon) };
        geocodeCache.set(address, c); return c;
      }
    }
  } catch(e) {}
  await new Promise(r => setTimeout(r, 1100));
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=us&limit=1&email=route@example.com`);
    if (r.ok) {
      const d = await r.json();
      if (d?.length) {
        const c = { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) };
        geocodeCache.set(address, c); return c;
      }
    }
  } catch(e) {}
  return null;
}

function dist(lat1,lon1,lat2,lon2){
  const R=6371e3, f1=lat1*Math.PI/180, f2=lat2*Math.PI/180,
        df=(lat2-lat1)*Math.PI/180, dl=(lon2-lon1)*Math.PI/180,
        a=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ═══════════════════════════
//  BUILD ROUTE
// ═══════════════════════════
async function buildRoute() {
  loadClients();

  if (!allClients.length) {
    document.getElementById('empty-state').style.display = 'block';
    setStatus('');
    return;
  }

  setStatus('Geocoding home address...');
  if (!homeCoords) {
    homeCoords = await geocode(homeAddress);
    if (!homeCoords) {
      setStatus('Could not find that address. Try adding city and state.');
      return;
    }
    localStorage.setItem('rHomeCoords', JSON.stringify(homeCoords));
  }

  const withCoords = [], noCoords = [];
  for (let i = 0; i < allClients.length; i++) {
    const c = allClients[i];
    setStatus(`Locating ${i+1} of ${allClients.length} — ${c.name}`);
    let coords = geocodeCache.get(c.address) || null;
    if (!coords && c.gpsLat && c.gpsLon)
      coords = { lat: parseFloat(c.gpsLat), lon: parseFloat(c.gpsLon) };
    if (!coords) coords = await geocode(c.address);
    if (coords) {
      c.gpsLat = coords.lat; c.gpsLon = coords.lon;
      withCoords.push({ ...c, _lat: coords.lat, _lon: coords.lon });
    } else {
      noCoords.push({ ...c });
    }
  }

  // nearest-neighbor chain
  const pool = [...withCoords];
  const ordered = [];
  let cLat = homeCoords.lat, cLon = homeCoords.lon;
  while (pool.length) {
    let bi = 0, bd = Infinity;
    pool.forEach((c,i) => { const d=dist(cLat,cLon,c._lat,c._lon); if(d<bd){bd=d;bi=i;} });
    const chosen = pool.splice(bi, 1)[0];
    ordered.push(chosen);
    cLat = chosen._lat; cLon = chosen._lon;
  }

  routeList    = [...ordered, ...noCoords];
  eodIndex     = 0;
  completedIds = new Set();
  pausedIds    = new Set();
  weekDone     = false;
  setStatus('');
  saveState();
  render();
}

// ═══════════════════════════
//  RENDER
// ═══════════════════════════
function render() {
  const container = document.getElementById('client-list');
  const emptyEl   = document.getElementById('empty-state');
  const addBtn    = document.getElementById('add-next-btn');
  container.innerHTML = '';

  // visible = not collapsed
  const visible = routeList.filter(c => !completedIds.has(c.id));

  if (!visible.length && !routeList.length) {
    emptyEl.style.display = 'block'; return;
  }
  emptyEl.style.display = 'none';

  // eodIndex in routeList → translate to visible position
  // dot sits AFTER the (eodIndex+1)th visible client
  let eodVisPos = 0;
  for (let i = 0; i <= eodIndex && i < routeList.length; i++) {
    if (!completedIds.has(routeList[i].id)) eodVisPos++;
  }
  // clamp
  eodVisPos = Math.min(eodVisPos, visible.length);

  visible.forEach((client, vi) => {
    // Insert EOD divider before this row if vi === eodVisPos
    if (vi === eodVisPos) container.appendChild(makeEodDivider());
    const row = makeRow(client, vi);
    container.appendChild(row);
  });

  // If eodVisPos >= visible.length, dot goes at the very end
  if (eodVisPos >= visible.length) container.appendChild(makeEodDivider());

  addBtn.style.display = weekDone ? 'block' : 'none';
  setupDragAndDrop();
}

function makeRow(client, vi) {
  const row = document.createElement('div');
  row.className = 'client-row' + (pausedIds.has(client.id) ? ' paused' : '');
  row.dataset.id = client.id;
  row.style.animationDelay = `${Math.min(vi,12) * 0.04}s`;

  const handle = document.createElement('div');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';

  const name = document.createElement('div');
  name.className = 'client-name';
  name.textContent = client.name || '—';
  name.addEventListener('click', () => navigateTo(client));

  const pauseBtn = document.createElement('button');
  pauseBtn.className = 'pause-btn' + (pausedIds.has(client.id) ? ' active' : '');
  pauseBtn.textContent = '⏸';
  pauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePause(client.id); });

  row.appendChild(handle);
  row.appendChild(name);
  row.appendChild(pauseBtn);
  return row;
}

function makeEodDivider() {
  const wrap = document.createElement('div');
  wrap.className = 'eod-divider';
  wrap.id = 'eod-divider';

  const l = document.createElement('div'); l.className = 'eod-line';
  const r = document.createElement('div'); r.className = 'eod-line';

  const dot = document.createElement('div');
  dot.className = 'eod-dot';
  const inner = document.createElement('div');
  inner.className = 'eod-dot-inner';
  dot.appendChild(inner);
  dot.addEventListener('click', pressEodDot);

  wrap.appendChild(l); wrap.appendChild(dot); wrap.appendChild(r);
  return wrap;
}

// ═══════════════════════════
//  EOD DOT
// ═══════════════════════════
function pressEodDot() {
  const dot = document.querySelector('#eod-divider .eod-dot');
  if (dot) { dot.classList.add('fired'); setTimeout(() => dot.classList.remove('fired'), 2800); }

  // Collect visible clients ABOVE the divider
  const visible = routeList.filter(c => !completedIds.has(c.id));
  let eodVisPos = 0;
  for (let i = 0; i <= eodIndex && i < routeList.length; i++) {
    if (!completedIds.has(routeList[i].id)) eodVisPos++;
  }
  eodVisPos = Math.min(eodVisPos, visible.length);
  const toCollapse = visible.slice(0, eodVisPos);
  if (!toCollapse.length) return;

  // Animate rows out
  toCollapse.forEach(client => {
    const row = document.querySelector(`.client-row[data-id="${client.id}"]`);
    if (row) {
      row.classList.add('collapsing');
      setTimeout(() => completedIds.add(client.id), 380);
    }
  });

  setTimeout(() => {
    // Advance eodIndex to the next non-completed client in routeList
    const nextVisible = routeList.findIndex((c, i) => !completedIds.has(c.id));
    eodIndex = nextVisible === -1 ? routeList.length - 1 : nextVisible;

    // Check if all done
    const remaining = routeList.filter(c => !completedIds.has(c.id) && !pausedIds.has(c.id));
    if (!remaining.length) weekDone = true;

    saveState();
    render();
  }, 420);
}

// ═══════════════════════════
//  PAUSE
// ═══════════════════════════
function togglePause(id) {
  if (pausedIds.has(id)) pausedIds.delete(id);
  else pausedIds.add(id);
  saveState(); render();
}

// ═══════════════════════════
//  NAVIGATE
// ═══════════════════════════
function navigateTo(client) {
  if (!client?.address) return;
  const addr = encodeURIComponent(client.address);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const url = isIOS
    ? `maps://maps.apple.com/?daddr=${addr}&dirflg=d`
    : `https://www.google.com/maps/dir/?api=1&destination=${addr}&travelmode=driving`;
  window.open(url, '_blank');
}

// ═══════════════════════════
//  ADD NEXT CLIENT (new week)
// ═══════════════════════════
async function addNextClient() {
  loadClients();
  const inRoute = new Set(routeList.map(c => c.id));
  const candidates = allClients.filter(c => !inRoute.has(c.id));
  if (!candidates.length) { setStatus('All clients are already in the route.'); return; }

  let lastLat = homeCoords?.lat || 0, lastLon = homeCoords?.lon || 0;
  for (let i = routeList.length - 1; i >= 0; i--) {
    if (routeList[i]._lat) { lastLat = routeList[i]._lat; lastLon = routeList[i]._lon; break; }
  }

  setStatus('Finding next closest...');
  let best = null, bestD = Infinity;
  for (const c of candidates) {
    let coords = geocodeCache.get(c.address) || null;
    if (!coords && c.gpsLat && c.gpsLon) coords = { lat: parseFloat(c.gpsLat), lon: parseFloat(c.gpsLon) };
    if (!coords) coords = await geocode(c.address);
    if (!coords) continue;
    const d = dist(lastLat, lastLon, coords.lat, coords.lon);
    if (d < bestD) { bestD = d; best = { ...c, _lat: coords.lat, _lon: coords.lon }; }
  }

  if (!best) { setStatus('Could not locate next client.'); return; }
  routeList.push(best);
  weekDone = false;
  setStatus(''); saveState(); render();
}

// ═══════════════════════════
//  GPS REFRESH
// ═══════════════════════════
function refreshGPS() {
  const btn = document.getElementById('radar-btn');
  btn.classList.add('spinning');
  setTimeout(() => btn.classList.remove('spinning'), 950);

  if (!navigator.geolocation) { setStatus('GPS not available'); return; }
  setStatus('Getting location...');
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    setStatus('Reordering by your position...');
    reorderFromPosition(lat, lon);
  }, () => setStatus('Could not get location'),
  { enableHighAccuracy: true, timeout: 10000 });
}

function reorderFromPosition(lat, lon) {
  const remaining = routeList.filter(c => !completedIds.has(c.id) && c._lat && c._lon);
  const noCoords  = routeList.filter(c => !completedIds.has(c.id) && (!c._lat || !c._lon));
  if (!remaining.length) { setStatus(''); return; }

  const pool = [...remaining];
  const ordered = [];
  let cLat = lat, cLon = lon;
  while (pool.length) {
    let bi=0, bd=Infinity;
    pool.forEach((c,i)=>{ const d=dist(cLat,cLon,c._lat,c._lon); if(d<bd){bd=d;bi=i;} });
    const chosen = pool.splice(bi,1)[0];
    ordered.push(chosen); cLat=chosen._lat; cLon=chosen._lon;
  }

  routeList = [...ordered, ...noCoords];
  eodIndex = 0;
  setStatus(''); saveState(); render();
}

// ═══════════════════════════
//  DRAG & DROP (touch)
// ═══════════════════════════
function setupDragAndDrop() {
  let dragEl=null, ghost=null, startY=0;

  document.querySelectorAll('.drag-handle').forEach(handle => {
    handle.addEventListener('touchstart', e => {
      const row = handle.closest('.client-row');
      if (!row) return;
      dragEl = row;
      startY = e.touches[0].clientY;
      const rect = row.getBoundingClientRect();
      ghost = row.cloneNode(true);
      ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:0.55;pointer-events:none;z-index:9999;border-radius:16px;background:rgba(255,255,255,0.15);`;
      document.body.appendChild(ghost);
      row.classList.add('dragging');
    }, {passive:true});

    handle.addEventListener('touchmove', e => {
      if (!ghost) return;
      e.preventDefault();
      const dy = e.touches[0].clientY - startY;
      const rect = dragEl.getBoundingClientRect();
      ghost.style.top = (rect.top + dy) + 'px';
    }, {passive:false});

    handle.addEventListener('touchend', e => {
      if (!ghost || !dragEl) return;
      ghost.remove(); ghost=null;
      dragEl.classList.remove('dragging');
      const touch = e.changedTouches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.client-row');
      if (target && target !== dragEl) {
        const fi = routeList.findIndex(c=>c.id===dragEl.dataset.id);
        const ti = routeList.findIndex(c=>c.id===target.dataset.id);
        if (fi!==-1 && ti!==-1) {
          const [m] = routeList.splice(fi,1);
          routeList.splice(ti,0,m);
          saveState(); render();
        }
      }
      dragEl=null;
    });
  });
}

// ═══════════════════════════
//  SEARCH
// ═══════════════════════════
function setupSearch() {
  const input = document.getElementById('search-input');
  const clearBtn = document.getElementById('search-clear');

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearBtn.classList.toggle('visible', q.length > 0);
    doHighlight(q);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = input.value.trim().toLowerCase();
      const row = document.querySelector('.client-row.highlighted');
      if (row) { row.scrollIntoView({behavior:'smooth',block:'center'}); }
      input.blur();
    }
    if (e.key === 'Escape') clearSearch();
  });
}

function doHighlight(q) {
  document.querySelectorAll('.client-row').forEach(row => {
    if (!q) { row.classList.remove('highlighted'); return; }
    const id = row.dataset.id;
    const c  = routeList.find(x => x.id === id);
    const match = c && (c.name||'').toLowerCase().includes(q.toLowerCase());
    row.classList.toggle('highlighted', !!match);
    if (match) row.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  doHighlight('');
}

// ═══════════════════════════
//  RADAR
// ═══════════════════════════
let radarStopped = false;
function stopRadar() {
  if (radarStopped) return; radarStopped = true;
  const r = document.getElementById('radar-overlay');
  if (r) { r.style.transition='opacity 0.8s'; r.style.opacity='0'; setTimeout(()=>r.style.display='none',800); }
}
setTimeout(stopRadar, 5000);

function setStatus(msg) { document.getElementById('status-line').textContent = msg; }

// ═══════════════════════════
//  SWIPE DOWN → BACK TO MAIN APP
// ═══════════════════════════
(function () {
  let startY = 0, currentY = 0, active = false, arrowEl = null;
  const THRESHOLD = 90;

  function getArrow() {
    if (arrowEl) return arrowEl;
    arrowEl = document.createElement('div');
    arrowEl.style.cssText = `
      position:fixed;top:24px;left:50%;transform:translateX(-50%);
      font-size:28px;z-index:9999;display:none;pointer-events:none;
      color:rgba(255,255,255,0.85);transition:opacity 0.15s;
    `;
    arrowEl.textContent = '↓ Back';
    document.body.appendChild(arrowEl);
    return arrowEl;
  }

  document.addEventListener('touchstart', e => {
    // Only activate when scrolled to top
    if (window.scrollY > 10) return;
    startY = e.touches[0].clientY;
    currentY = startY;
    active = true;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!active) return;
    currentY = e.touches[0].clientY;
    const pull = currentY - startY;
    if (pull > 15) {
      const arrow = getArrow();
      arrow.style.display = 'block';
      arrow.style.opacity = Math.min(pull / THRESHOLD, 1);
    }
  }, { passive: true });

  document.addEventListener('touchend', () => {
    if (!active) return;
    active = false;
    const arrow = getArrow();
    arrow.style.display = 'none';
    const pull = currentY - startY;
    if (pull > THRESHOLD) {
      window.location.href = 'index.html';
    }
    startY = 0; currentY = 0;
  });
})();
</script>
